
name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar proyecto
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

          mkdir -p www
          HTML_FILE=$(find . -maxdepth 1 -type f -name '*.html' | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo HTML"
            exit 1
          fi

          cp "$HTML_FILE" www/index.html

          echo '{"appId":"com.ejemplo.monitorsalud","appName":"Monitor de Salud","webDir":"www"}' > capacitor.config.json

          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: MonitorSalud-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
